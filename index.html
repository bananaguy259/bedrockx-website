<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BedrockX - Minecraft Bedrock Mods, Texture Packs &amp; More</title>
<meta name="description" content="BedrockX is your ultimate hub for Minecraft Bedrock mods, texture packs, scripts, maps, and skins."/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="images/favicon.ico"/>
<link rel="apple-touch-icon" href="images/apple-icon.png"/>

<style>
  @font-face {
    font-family: "Minecraft";
    src: url("fonts/MinecraftTen-s.p.86b208cb.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "Mojangles";
    src: url("fonts/Mojangles-s.p.12c64e58.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "MojanglesBold";
    src: url("fonts/MojanglesBold-s.p.a47aac16.otf") format("opentype");
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: "MinecraftFive";
    src: url("fonts/MinecraftFive-s.p.436a4121.ttf") format("truetype");
    font-weight: 700;
    font-display: swap;
  }

  :root{
    --bg: #1e1e1f;
    --bg-panel: #2f2f30;
    --text: #ffffff;
    --text-dim: #d0d1d4;
    --red: #b73737;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    height: 100%;
  }

  body {
    font-family: "Mojangles", ui-monospace, "Courier New", monospace;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid #3c3d3e;
  }

  header img {
    width: 40px;
    height: 40px;
    border-radius: 8px;
  }

  header span {
    font-family: "Minecraft", "Mojangles", monospace;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-shadow: 2px 2px 0 var(--red);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    gap: 24px;
    background-image:
      linear-gradient(rgba(30,30,31,0.35), rgba(30,30,31,0.75)),
      url("images/hero-bg.jpg");
    background-size: cover;
    background-position: center;
  }

  h1 {
    font-family: "Minecraft", "Mojangles", monospace;
    font-size: clamp(32px, 8vw, 56px);
    margin: 0;
    text-shadow: 4px 4px 0 var(--red);
  }

  p.tagline {
    font-family: "Mojangles", monospace;
    color: var(--text-dim);
    max-width: 560px;
    font-size: 16px;
    line-height: 1.5;
    margin: 0;
  }

  .download-btn {
    font-family: "Mojangles", monospace;
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background-color: var(--red);
    border: 4px solid #3c3d3e;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,0.35),
      inset 4px 4px 0 rgba(255,255,255,0.12);
    padding: 22px 56px;
    font-size: 22px;
    letter-spacing: 1px;
    cursor: pointer;
    image-rendering: pixelated;
    transition: transform 0.05s ease;
  }

  .download-btn:hover {
    filter: brightness(1.08);
  }

  .download-btn:active {
    transform: translateY(2px);
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.35),
      inset 2px 2px 0 rgba(255,255,255,0.12);
  }

  footer {
    text-align: center;
    padding: 16px;
    font-family: "Mojangles", monospace;
    color: var(--text-dim);
    font-size: 13px;
    background: var(--bg-panel);
    border-top: 1px solid #3c3d3e;
  }
</style>
</head>
<body>

<header>
  <img src="images/logo.png" alt="BedrockX logo"/>
  <span>BedrockX</span>
</header>

<main>
  <h1>BedrockX</h1>
  <p class="tagline">
    The most powerful and customizable texture pack for Minecraft Bedrock Edition.
  </p>
  <a href="#" class="download-btn">Download</a>
</main>

<footer>
  Copyright © BedrockX | All rights reserved | Not affiliated with Mojang Studios
</footer>

</body>
</html>
